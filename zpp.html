    <style>

      .zpp-corner{position:absolute;top:14px;right:14px;z-index:1;background:var(--lime);padding:6px 9px;font:10px var(--mono);pointer-events:none}
      @media(max-width:760px){.site-header{height:70px}.zpp-page{min-height:calc(100vh - 70px);padding:28px 6vw 0}.zpp-intro{display:block;padding:0 0 22px}.zpp-copy{margin-top:20px}.zpp-frame-wrap,.zpp-frame{min-height:calc(100vh - 270px)}.zpp-corner{font-size:9px}}
